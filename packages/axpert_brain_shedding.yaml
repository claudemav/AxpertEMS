# =====================================================================
# AXPERT BRAIN — Délestage / Restauration des charges
#
# Charges pilotées via Labels HA :
#   - "delestage_tier1" / "delestage_tier2" / "delestage_tier3"
#
# RÈGLE DE DÉLESTAGE (inchangée depuis le 28/07) : le SOC n'intervient
# plus. Seuls comptent réseau absent + déficit confirmé.
#
# RÈGLE DE RESTAURATION (nouveau, point critique) :
#   Avant le "point critique" (premier déficit confirmé après le midi
#   solaire) : restauration possible soit par retour du réseau, soit
#   par un PV qui redevient suffisant (le déficit était peut-être
#   passager, avant le pic — légitime de redémarrer).
#   Après le point critique (axpert_solar_decline_confirmed actif,
#   sticky jusqu'à 23h) : restauration UNIQUEMENT par retour du réseau
#   — on sait que le PV ne peut plus que décliner le reste de la
#   journée, donc un "déficit qui se résorbe" après ce point n'est pas
#   fiable comme signal de restauration (évite aussi les oscillations
#   observées le 26/07).
# =====================================================================

input_boolean:

  axpert_solar_decline_confirmed:
    name: Axpert Déclin solaire confirmé (interne, point critique du jour)
    icon: mdi:weather-sunset-down

automation:

  # ---------------------------------------------------------------
  # Détection du point critique : premier déficit CONFIRMÉ après le
  # midi solaire (12h locale). Reste actif jusqu'à 23h (night_start),
  # même repère de remise à zéro que le reste du système (cf
  # axpert_brain_max_battery_schedule.yaml).
  # ---------------------------------------------------------------
  - alias: "Axpert Brain — Détection point critique solaire"
    id: axpert_brain_solar_decline_detect
    mode: single

    triggers:
      - trigger: state
        entity_id: binary_sensor.axpert_deficit_solaire
        to: "on"
      - trigger: time_pattern
        minutes: "/1"

    variables:
      night_start_str: >
        {% set raw = states('sensor.debarras_maison_axpert_config_night_start') %}
        {{ raw if raw not in ['unknown', 'unavailable', none, ''] else '23:00' }}
      is_night_start_now: "{{ now().strftime('%H:%M') == night_start_str }}"
      after_noon: "{{ now().time() >= strptime('12:00', '%H:%M').time() }}"
      deficit_now: "{{ is_state('binary_sensor.axpert_deficit_solaire', 'on') }}"

    actions:
      - choose:
          - conditions: >
              {{ trigger.platform == 'state' and after_noon and deficit_now }}
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.axpert_solar_decline_confirmed

          - conditions: "{{ trigger.platform == 'time_pattern' and is_night_start_now }}"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.axpert_solar_decline_confirmed

  # ---------------------------------------------------------------
  # Délestage et restauration
  # ---------------------------------------------------------------
  - alias: "Axpert Brain — Délestage et restauration"
    id: axpert_brain_shedding
    mode: queued
    max: 5
    max_exceeded: silent

    triggers:
      - trigger: state
        entity_id: binary_sensor.axpert_deficit_solaire
        for:
          seconds: 20
      - trigger: state
        entity_id: binary_sensor.axpert_grid_down
        for:
          seconds: 20
      - trigger: state
        entity_id: input_boolean.axpert_solar_decline_confirmed
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id: timer.axpert_shedding_pause
        to: "idle"

    conditions:
      - condition: template
        value_template: >
          {{ ['sensor.debarras_maison_tension_reseau',
              'sensor.debarras_maison_puissance_pv',
              'sensor.debarras_maison_puissance_sortie',
              'sensor.axpert_battery_capacity_filtered',
              'binary_sensor.axpert_deficit_solaire',
              'binary_sensor.axpert_grid_down']
             | map('states')
             | select('in', ['unavailable', 'unknown', none])
             | list | length == 0 }}

    variables:
      grid_down: "{{ is_state('binary_sensor.axpert_grid_down', 'on') }}"
      grid_up: "{{ not grid_down }}"
      deficit: "{{ is_state('binary_sensor.axpert_deficit_solaire', 'on') }}"
      battery_capacity: "{{ states('sensor.axpert_battery_capacity_filtered')|float(0) }}"
      soc_threshold: "{{ states('sensor.debarras_maison_axpert_config_soc_threshold')|float(35) }}"
      solar_decline_confirmed: "{{ is_state('input_boolean.axpert_solar_decline_confirmed', 'on') }}"

      # Délestage : sans condition SOC, à n'importe quelle heure.
      shed_needed: "{{ grid_down and deficit }}"

      # Restauration : avant le point critique, réseau OU PV suffisant.
      # Après le point critique, réseau UNIQUEMENT.
      restore_needed: >
        {% if solar_decline_confirmed %}
          {{ grid_up }}
        {% else %}
          {{ grid_up or not deficit }}
        {% endif %}

      night_start_str: >
        {% set raw = states('sensor.debarras_maison_axpert_config_night_start') %}
        {{ raw if raw not in ['unknown', 'unavailable', none, ''] else '23:00' }}
      sun_below_horizon: "{{ is_state('sun.sun', 'below_horizon') }}"

      night_restore_ok: >
        {% set night_start = strptime(night_start_str, '%H:%M').time() %}
        {{ now().time() >= night_start
           or (sun_below_horizon and now().time() < strptime('12:00', '%H:%M').time()) }}
      night_restore_active: "{{ night_restore_ok and battery_capacity > soc_threshold }}"

      loads: >
        {% set ns = namespace(items=[]) %}
        {% for tier_num, label_id, default_delay_key, default_delay in [
             (1, 'delestage_tier1', 'sensor.debarras_maison_axpert_config_restore_delay_tier1', 180),
             (2, 'delestage_tier2', 'sensor.debarras_maison_axpert_config_restore_delay_tier2', 5),
             (3, 'delestage_tier3', 'sensor.debarras_maison_axpert_config_restore_delay_tier3', 5)
           ] %}
          {% for ent in label_entities(label_id) %}
            {% if ent.startswith('switch.') %}
              {% set delay_cfg = states(default_delay_key) %}
              {% set delay = delay_cfg | float(default_delay) if delay_cfg not in ['unknown', 'unavailable', none, ''] else default_delay %}
              {% set object_id = ent.split('.')[1] %}
              {% set progress_id = 'input_boolean.axpert_command_in_progress_' ~ object_id %}
              {% set progress_id = progress_id if states[progress_id] is not none else '' %}
              {% set ns.items = ns.items + [{
                   'entity_id': ent,
                   'tier': tier_num,
                   'restore_delay': delay,
                   'lock_entity_id': 'input_boolean.axpert_manual_lock_' ~ object_id,
                   'progress_entity_id': progress_id
              }] %}
            {% endif %}
          {% endfor %}
        {% endfor %}
        {{ ns.items }}

      tier1_all_off: >
        {% set ns = namespace(all_off=true) %}
        {% set t1 = loads | selectattr('tier', 'eq', 1) | list %}
        {% for l in t1 %}
          {% if not is_state(l.entity_id, 'off') %}{% set ns.all_off = false %}{% endif %}
        {% endfor %}
        {{ t1 | length > 0 and ns.all_off }}

      shedding_paused: "{{ is_state('timer.axpert_shedding_pause', 'active') }}"
      tier1_shed_allowed: "{{ shed_needed and not night_restore_active and not shedding_paused }}"

    actions:

      - if:
          - condition: template
            value_template: "{{ tier1_shed_allowed }}"
        then:
          - repeat:
              for_each: "{{ loads | selectattr('tier', 'eq', 1) | list }}"
              sequence:
                - if:
                    - condition: template
                      value_template: "{{ is_state(repeat.item.entity_id, 'on') }}"
                  then:
                    - if:
                        - condition: template
                          value_template: "{{ repeat.item.progress_entity_id != '' }}"
                      then:
                        - action: input_boolean.turn_on
                          target:
                            entity_id: "{{ repeat.item.progress_entity_id }}"
                    - action: switch.turn_off
                      target:
                        entity_id: "{{ repeat.item.entity_id }}"
                    - wait_template: "{{ is_state(repeat.item.entity_id, 'off') }}"
                      timeout: "00:00:15"
                      continue_on_timeout: true
                    - if:
                        - condition: template
                          value_template: "{{ repeat.item.progress_entity_id != '' }}"
                      then:
                        - action: input_boolean.turn_off
                          target:
                            entity_id: "{{ repeat.item.progress_entity_id }}"

      - if:
          - condition: template
            value_template: "{{ shed_needed and tier1_all_off and not shedding_paused }}"
        then:
          - repeat:
              for_each: "{{ loads | selectattr('tier', 'eq', 2) | list }}"
              sequence:
                - if:
                    - condition: template
                      value_template: "{{ is_state(repeat.item.entity_id, 'on') }}"
                  then:
                    - if:
                        - condition: template
                          value_template: "{{ repeat.item.progress_entity_id != '' }}"
                      then:
                        - action: input_boolean.turn_on
                          target:
                            entity_id: "{{ repeat.item.progress_entity_id }}"
                    - action: switch.turn_off
                      target:
                        entity_id: "{{ repeat.item.entity_id }}"
                    - wait_template: "{{ is_state(repeat.item.entity_id, 'off') }}"
                      timeout: "00:00:15"
                      continue_on_timeout: true
                    - if:
                        - condition: template
                          value_template: "{{ repeat.item.progress_entity_id != '' }}"
                      then:
                        - action: input_boolean.turn_off
                          target:
                            entity_id: "{{ repeat.item.progress_entity_id }}"

      - variables:
          tier2_all_off: >
            {% set ns2 = namespace(all_off=true) %}
            {% set t2 = loads | selectattr('tier', 'eq', 2) | list %}
            {% for l in t2 %}
              {% if not is_state(l.entity_id, 'off') %}{% set ns2.all_off = false %}{% endif %}
            {% endfor %}
            {{ t2 | length == 0 or ns2.all_off }}
      - if:
          - condition: template
            value_template: "{{ shed_needed and tier1_all_off and tier2_all_off and not shedding_paused }}"
        then:
          - repeat:
              for_each: "{{ loads | selectattr('tier', 'eq', 3) | list }}"
              sequence:
                - if:
                    - condition: template
                      value_template: "{{ is_state(repeat.item.entity_id, 'on') }}"
                  then:
                    - if:
                        - condition: template
                          value_template: "{{ repeat.item.progress_entity_id != '' }}"
                      then:
                        - action: input_boolean.turn_on
                          target:
                            entity_id: "{{ repeat.item.progress_entity_id }}"
                    - action: switch.turn_off
                      target:
                        entity_id: "{{ repeat.item.entity_id }}"
                    - wait_template: "{{ is_state(repeat.item.entity_id, 'off') }}"
                      timeout: "00:00:15"
                      continue_on_timeout: true
                    - if:
                        - condition: template
                          value_template: "{{ repeat.item.progress_entity_id != '' }}"
                      then:
                        - action: input_boolean.turn_off
                          target:
                            entity_id: "{{ repeat.item.progress_entity_id }}"

      - if:
          - condition: template
            value_template: "{{ restore_needed and not shed_needed }}"
        then:
          - repeat:
              for_each: "{{ loads }}"
              sequence:
                - if:
                    - condition: template
                      value_template: >
                        {{ is_state(repeat.item.entity_id, 'off')
                           and not is_state(repeat.item.lock_entity_id, 'on') }}
                  then:
                    - delay:
                        seconds: "{{ repeat.item.restore_delay }}"
                    - if:
                        - condition: template
                          value_template: >
                            {{ is_state(repeat.item.entity_id, 'off')
                               and not is_state(repeat.item.lock_entity_id, 'on')
                               and (not is_state('binary_sensor.axpert_grid_down', 'on')
                                    or (not is_state('input_boolean.axpert_solar_decline_confirmed', 'on')
                                        and not is_state('binary_sensor.axpert_deficit_solaire', 'on'))) }}
                      then:
                        - if:
                            - condition: template
                              value_template: "{{ repeat.item.progress_entity_id != '' }}"
                          then:
                            - action: input_boolean.turn_on
                              target:
                                entity_id: "{{ repeat.item.progress_entity_id }}"
                        - action: switch.turn_on
                          target:
                            entity_id: "{{ repeat.item.entity_id }}"
                        - wait_template: "{{ is_state(repeat.item.entity_id, 'on') }}"
                          timeout: "00:00:15"
                          continue_on_timeout: true
                        - if:
                            - condition: template
                              value_template: "{{ repeat.item.progress_entity_id != '' }}"
                          then:
                            - action: input_boolean.turn_off
                              target:
                                entity_id: "{{ repeat.item.progress_entity_id }}"
