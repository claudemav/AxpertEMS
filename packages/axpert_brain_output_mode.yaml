# =====================================================================
# AXPERT BRAIN — Choix du mode de sortie (E2C / BATTERIE)
#
# CONFIRMÉ EMPIRIQUEMENT (02/08, trames QPIGS SOLAIRE vs E2C
# identiques : battery_discharge_current=0 dans les deux cas malgré un
# déficit PV de ~1200W, is_ac_charging_on=1 dans les deux cas) : sur ce
# firmware Victor NM-ECO, "SOLAIRE" (Solar first, POP01) se comporte
# exactement comme "E2C" (Utility first, POP00) — aucune différence de
# comportement réel mesurée. SOLAIRE est donc traité comme un alias
# d'E2C dans toute la logique de décision ci-dessous : partout où
# current_mode == 'E2C' ou current_mode != 'E2C' intervenait, on teste
# maintenant current_mode in ['E2C', 'SOLAIRE'] / not in [...]. Ça évite
# qu'une bascule manuelle vers SOLAIRE soit traitée comme un état
# "ni E2C ni BATTERIE" qui forcerait un retour prématuré vers BATTERIE
# dès que le déficit se résorbe, alors que SOLAIRE se comporte déjà
# comme E2C dans les faits.
#
# Ce composant continue de choisir librement entre E2C/BATTERIE comme
# cibles automatiques (jamais SOLAIRE) — ce changement ne concerne que
# la RECONNAISSANCE d'un mode SOLAIRE choisi manuellement, pas son
# utilisation comme cible.
# =====================================================================

input_boolean:

  axpert_max_battery_mode:
    name: Axpert Mode Max Batterie
    icon: mdi:battery-charging-100

  axpert_manual_output_mode:
    name: Axpert Mode de sortie manuel
    icon: mdi:hand-back-right

input_select:

  axpert_ems_mode:
    name: Axpert EMS Mode
    icon: mdi:brain
    options:
      - NORMAL
      - VACANCES
    initial: NORMAL

automation:

  - alias: "Axpert Brain — Mode de sortie"
    id: axpert_brain_output_mode
    mode: queued
    max: 5
    max_exceeded: silent

    triggers:
      - trigger: state
        entity_id: binary_sensor.axpert_deficit_solaire
      - trigger: state
        entity_id: binary_sensor.axpert_grid_down
      - trigger: state
        entity_id: sensor.axpert_battery_capacity_filtered
      - trigger: state
        entity_id: input_select.axpert_ems_mode
      - trigger: state
        entity_id: sensor.tele_puissance
      - trigger: state
        entity_id: input_boolean.axpert_max_battery_mode
      - trigger: state
        entity_id: input_boolean.axpert_evening_decline
      - trigger: state
        entity_id: input_boolean.axpert_manual_output_mode
      - trigger: time_pattern
        minutes: "/1"

    conditions:
      - condition: template
        value_template: >
          {{ not is_state('input_boolean.axpert_manual_output_mode', 'on') }}
      - condition: template
        value_template: >
          {{ ['sensor.debarras_maison_tension_reseau',
              'sensor.debarras_maison_puissance_pv',
              'sensor.debarras_maison_puissance_sortie',
              'sensor.axpert_battery_capacity_filtered']
             | map('states')
             | select('in', ['unavailable', 'unknown', none])
             | list | length == 0 }}

    variables:
      current_mode: "{{ states('select.debarras_maison_axpert_output_mode') }}"
      # SOLAIRE traité comme équivalent d'E2C (cf commentaire d'en-tête).
      current_mode_is_grid_like: "{{ current_mode in ['E2C', 'SOLAIRE'] }}"
      grid_down: "{{ is_state('binary_sensor.axpert_grid_down', 'on') }}"
      grid_up: "{{ not grid_down }}"
      deficit: "{{ is_state('binary_sensor.axpert_deficit_solaire', 'on') }}"
      battery_capacity: "{{ states('sensor.axpert_battery_capacity_filtered')|float(0) }}"
      soc_threshold: "{{ states('sensor.debarras_maison_axpert_config_soc_threshold')|float(35) }}"
      battery_critical_threshold: "{{ states('sensor.debarras_maison_axpert_config_battery_critical_threshold')|float(20) }}"
      battery_soc_ok: "{{ battery_capacity > soc_threshold }}"
      vacances: "{{ states('input_select.axpert_ems_mode') == 'VACANCES' }}"
      tele_power_low: >
        {% set raw = states('sensor.tele_puissance') %}
        {{ raw in ['unavailable', 'unknown', none] or raw|float(999) < 10 }}
      max_battery_mode: "{{ is_state('input_boolean.axpert_max_battery_mode', 'on') }}"
      max_battery_blocks_e2c: "{{ max_battery_mode and battery_capacity > battery_critical_threshold }}"
      evening_decline: "{{ is_state('input_boolean.axpert_evening_decline', 'on') }}"
      night_start_str: >
        {% set raw = states('sensor.debarras_maison_axpert_config_night_start') %}
        {{ raw if raw not in ['unknown', 'unavailable', none, ''] else '23:00' }}
      sun_below_horizon: "{{ is_state('sun.sun', 'below_horizon') }}"
      night_restore_window: >
        {% set night_start = strptime(night_start_str, '%H:%M').time() %}
        {{ now().time() >= night_start
           or (sun_below_horizon and now().time() < strptime('12:00', '%H:%M').time()) }}

    actions:
      - choose:

          # 1. Nuit tardive + SOC ok -> BATTERIE (annule un E2C/SOLAIRE
          #    sticky en cours).
          - conditions: >
              {{ night_restore_window and battery_soc_ok
                 and current_mode != 'BATTERIE'
                 and (not vacances or tele_power_low) }}
            sequence:
              - action: select.select_option
                target: { entity_id: select.debarras_maison_axpert_output_mode }
                data: { option: BATTERIE }

          # 2. Déficit + réseau dispo -> E2C, sauf si déjà en mode
          #    "type réseau" (E2C ou SOLAIRE).
          - conditions: >
              {{ not night_restore_window and not max_battery_blocks_e2c
                 and deficit and grid_up and not current_mode_is_grid_like }}
            sequence:
              - action: select.select_option
                target: { entity_id: select.debarras_maison_axpert_output_mode }
                data: { option: E2C }

          # 3. PV couvre -> autoconsommation. Sticky (E2C ou SOLAIRE)
          #    uniquement pendant le déclin du soir.
          - conditions: >
              {{ not deficit and (current_mode != 'BATTERIE'
                 and (not current_mode_is_grid_like or not evening_decline)) }}
            sequence:
              - action: select.select_option
                target: { entity_id: select.debarras_maison_axpert_output_mode }
                data: { option: BATTERIE }
