# =====================================================================
# AXPERT BRAIN — Courant de charge asservi à la production PV réelle
#
# REMPLACE la logique précédente (10A fixe en E2C / 40A fixe en
# SOLAIRE-BATTERIE). Cette distinction par mode n'a plus de sens
# puisqu'on a confirmé (02/08) que charger_source_priority et MUCHGC
# n'empêchent PAS réellement l'apport réseau à la charge, quel que soit
# le mode de sortie — seul MNCHGC (plafond TOTAL, toutes sources)
# s'est révélé réellement effectif.
#
# Principe : MNCHGC suit en continu ce que le PV peut réellement
# fournir (arrondi au palier disponible le plus proche, au-dessus).
# Le réseau ne peut alors combler qu'un écart résiduel minimal (la
# marge d'arrondi au palier, 10A de granularité), au lieu de pouvoir
# combler jusqu'à 40A comme avant. Ne dépend plus du mode de sortie —
# fonctionne aussi bien en E2C qu'en SOLAIRE/BATTERIE, puisqu'on sait
# que la distinction de mode ne protège de toute façon pas la charge.
#
# LIMITE CONNUE : la granularité des paliers (pas de 10A) empêche de
# descendre sous 10A même si le PV ne produit que 2-3A — un écart
# résiduel réseau reste possible dans ce cas, mais très réduit par
# rapport à l'ancien plafond fixe de 40A.
# =====================================================================

input_boolean:

  axpert_manual_lock_max_charging_current:
    name: Axpert Verrou manuel Courant de charge (toutes sources)
    icon: mdi:lock

  axpert_command_in_progress_max_charging_current:
    name: Axpert Brain — Commande courant charge en cours (interne)
    icon: mdi:cog-sync

automation:

  - alias: "Axpert Brain — Détection changement manuel Courant Charge"
    id: axpert_brain_manual_detect_max_charging_current
    mode: queued
    triggers:
      - trigger: state
        entity_id: select.debarras_maison_axpert_max_charging_current
    conditions:
      - condition: template
        value_template: >
          {{ not is_state('input_boolean.axpert_command_in_progress_max_charging_current', 'on') }}
      - condition: template
        value_template: >
          {{ trigger.from_state is not none and trigger.to_state is not none
             and trigger.from_state.state != trigger.to_state.state }}
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.axpert_manual_lock_max_charging_current

  - alias: "Axpert Brain — Sécurité command_in_progress courant bloqué"
    id: axpert_brain_charge_current_command_in_progress_timeout
    triggers:
      - trigger: state
        entity_id: input_boolean.axpert_command_in_progress_max_charging_current
        to: "on"
        for:
          seconds: 15
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: "{{ trigger.entity_id }}"

  - alias: "Axpert Brain — Courant de charge asservi au PV"
    id: axpert_brain_charge_current_by_mode
    mode: single

    triggers:
      - trigger: time_pattern
        minutes: "/2"
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: input_boolean.axpert_manual_lock_max_charging_current
        to: "off"

    conditions:
      - condition: template
        value_template: >
          {{ ['sensor.axpert_pv_power_filtered', 'sensor.debarras_maison_tension_batterie']
             | map('states')
             | select('in', ['unavailable', 'unknown', none])
             | list | length == 0 }}

    variables:
      pv_power: "{{ states('sensor.axpert_pv_power_filtered')|float(0) }}"
      battery_voltage: "{{ states('sensor.debarras_maison_tension_batterie')|float(26) }}"
      # Courant PV estimé, arrondi au-dessus (ceil) pour ne jamais
      # brider le PV en dessous de sa capacité réelle.
      pv_current_estimated: "{{ (pv_power / battery_voltage) | round(0, 'ceil') if battery_voltage > 0 else 10 }}"

      # Paliers réellement supportés par CET onduleur (attribut natif du
      # select, alimenté par la découverte QMCHGCR au démarrage).
      available_options: >
        {{ (state_attr('select.debarras_maison_axpert_max_charging_current', 'options') or [])
           | map('int') | sort | list }}

      target_mchgc: >
        {% set opts = available_options %}
        {% if opts | length == 0 %}
          10
        {% else %}
          {% set candidates = opts | select('ge', pv_current_estimated) | list %}
          {{ candidates[0] if candidates | length > 0 else opts[-1] }}
        {% endif %}

      current_mchgc: "{{ states('select.debarras_maison_axpert_max_charging_current') }}"
      mchgc_locked: "{{ is_state('input_boolean.axpert_manual_lock_max_charging_current', 'on') }}"

    actions:
      - if:
          - condition: template
            value_template: "{{ not mchgc_locked and current_mchgc != target_mchgc|string }}"
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.axpert_command_in_progress_max_charging_current
          - action: select.select_option
            target:
              entity_id: select.debarras_maison_axpert_max_charging_current
            data:
              option: "{{ target_mchgc|string }}"
          - wait_template: >
              {{ states('select.debarras_maison_axpert_max_charging_current') == target_mchgc|string }}
            timeout: "00:00:10"
            continue_on_timeout: true
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.axpert_command_in_progress_max_charging_current
