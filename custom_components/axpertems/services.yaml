send_raw_command:
  name: Send raw command (diagnostic)
  description: >
    Sends a raw PI30 command to the inverter and returns the response
    as-is (useful to identify a divergent command format on a clone,
    e.g. MCHGC40 vs MCHGC010).
  fields:
    device_id:
      name: Inverter
      description: Target inverter (only required if you have more than one AxpertEMS device configured)
      required: false
      selector:
        device:
          integration: axpertems
    command:
      name: Command
      description: "PI30 command without CRC or CR (e.g. MCHGC40, QPIGS, QMCHGCR)"
      required: true
      example: "MCHGC40"
      selector:
        text: